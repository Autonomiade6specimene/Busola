function option(value,label,current){return `<option value="${value}" ${current===value?'selected':''}>${label}</option>`}
function selectField(key,label,options,hint=''){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" name="${key}">${options.map(([v,l])=>option(v,l,draft[key])).join('')}</select>${hint?`<small>${hint}</small>`:''}</div>`}
function gradeField(key,label,hint,required=true){return `<div class="field"><label for="${key}">${label}</label><input id="${key}" name="${key}" type="number" min="1" max="10" step="0.01" inputmode="decimal" value="${esc(draft[key])}" placeholder="ex. 8,50" ${required?'required':''}><small>${hint}</small></div>`}

  if(step===1)content=`<h3>Adăugăm și partea academică.</h3><p>Poți introduce note estimate. Le folosim în formulele publicate, nu pentru a prezice admiterea.</p><div class="field-grid">${gradeField('bac','Media la bacalaureat','Pe scara 1–10; media generală, obținută sau estimată.')}${gradeField('school','Media anilor de liceu','Media generală a anilor de studii, pe scara 1–10.')}${selectField('diploma','Situația bacalaureatului',[['planned','Urmează să îl susțin'],['obtained','Am diploma de bac'],['no','Nu am promovat încă']])}${selectField('math','Matematică la bac',[['unknown','Nu știu încă'],['yes','Da, susțin / am susținut'],['no','Nu']], 'Contează pentru ruta de admitere Twente din catalog.')}${selectField('english','Dovada de engleză',[['planned','O voi pregăti / voi verifica scutirea'],['proof','Am o dovadă; trebuie verificată'],['no','Nu am încă o dovadă']], 'Acceptarea certificatului sau scutirii o decide universitatea.')}</div>${examSection()}`;
  if(step===2)content=`<h3>Cum arată următorul tău capitol?</h3><p>Câteva preferințe ne ajută să restrângem lista.</p><div class="field-grid">${account?'':`<div class="field"><label for="name">Cum îți spunem? · opțional</label><input id="name" name="name" type="text" maxlength="30" value="${esc(draft.name)}" placeholder="Prenumele tău" autocomplete="off"><small>Rămâne pe acest dispozitiv.</small></div>`}${selectField('country','Unde ai studia?',[['all','România și Țările de Jos'],['ro','România'],['nl','Țările de Jos']])}${selectField('language','Limba de predare',[['all','Română sau engleză'],['ro','Doar română'],['en','Doar engleză']])}${selectField('written','Examen scris de admitere',[['any','Sunt deschis(ă) și la un examen'],['avoid','Prefer programe fără examen scris']], 'Exclude programele cu examen scris din catalog.')}</div>`;

}
function validateStep(){
  let message='';
  if(step===0&&(!draft.interests.length||draft.interests.length>Busola.maxInterests)) message=`Alege între 1 și ${Busola.maxInterests} interese pentru a continua.`;
  if(step===1){
    for(const [key,label] of [['bac','media la bac'],['school','media anilor de liceu']]){
      if(!Busola.grade(draft[key])){message=`Introdu ${label} între 1 și 10.`;document.getElementById(key)?.focus();break}
    }
    if(!message)for(const f of Busola.examFields){const v=draft[f.key];if(v===''||v===undefined)continue;if(!Busola.examValid(f,v)){message=`${f.label}: introdu ${f.step==='1'?'un punctaj întreg':'o notă'} între ${f.min} și ${f.max} sau lasă câmpul gol.`;document.getElementById(f.key)?.focus();break}}
    if(!message&&draft.diploma==='obtained'&&Number(draft.bac)<6)message='Ai selectat o diplomă obținută, dar media la bac este sub 6. Corectează media sau situația bacalaureatului.';
  }
  if(message){$('#form-error').textContent=message;return false}return true;
}

function filtered(list){const q=query.trim().toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return list.filter(p=>(p.name+' '+p.uni+' '+p.short+' '+p.city).toLocaleLowerCase('ro').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q))}
function cardsMarkup(list){

}

function comparebar(){return compared.length?`<div class="comparebar"><span>${compared.length} din 3 programe selectate pentru comparație</span><button class="btn light small" data-go="compare">Compară opțiunile →</button></div>`:''}
function comparison(){

v class="source-card"><span class="source-number">0${i+1}</span><div><h3>${s.label}</h3><p>${s.year} · ${key==='ase'?'Formule și probe de admitere.':key==='offer'?'Denumiri de programe și oferta instituției.':key==='diploma'?'Ruta standard pentru diploma românească; verifică secțiunea Romania.':'Cerințe de acces la program.'}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">Deschide sursa oficială ↗</a></div></div>`).join('')}</div><div class="split"><div><h3>Datele tale rămân aici.</h3><p>Profilul și selecțiile sunt salvate în browser, dacă stocarea locală este disponibilă. Nu sunt trimise către un server. Datele nu se transferă automat când copiezi aplicația pe alt calculator.</p><button class="quiet" data-action="reset">Șterge profilul și selecțiile locale</button></div><div><h3>Funcționează și fără internet.</h3><p>Chestionarul, recomandările și comparația sunt locale. Ai nevoie de internet doar când deschizi linkurile către universități. Dacă browserul blochează stocarea locală, aplicația funcționează în continuare în sesiunea curentă.</p></div></div>`}

function toggleCompare(id){
  if(!Busola.programs.some(p=>p.id===id))return;

  else{toast('Poți compara maximum 3 programe. Elimină unul înainte să adaugi altul.');return}
  persist();renderNav();

</script><script>'use strict';
const ACCOUNT_KEY='busola-accounts-demo-v2',SESSION_KEY='busola-session-demo-v2';
let accounts=[];try{const raw=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||'[]');if(Array.isArray(raw))accounts=raw.filter(a=>a&&typeof a.id==='string'&&typeof a.email==='string'&&typeof a.name==='string').map(a=>({...a,name:a.name.slice(0,40),email:a.email.slice(0,120),plan:a.plan==='premium'?'premium':'free'}))}catch{}

let favorites=[],tasks={},catalogQuery='',catalogCountry='all',catalogUniversity='all',catalogFuture=false,authMode='create';

function loadAccount(){const a=currentAccount();if(!a)return;const restored=cleanProfile(a.profile);profile=restored;if(profile&&(profile.reviewInterests||!profile.interests.length||!Busola.grade(profile.bac)||!Busola.grade(profile.school)))profile=null;draft=clone(restored||Busola.emptyProfile());draft.name=a.name;if(profile)profile.name=a.name;compared=validIds(a.compared).slice(0,compareLimit());favorites=validIds(a.favorites);tasks=a.tasks&&typeof a.tasks==='object'?a.tasks:{};query=''}

renderNav=function(){const nav=[['home','Descoperă','home'],['catalog','Catalog universități','sources'],['profile','Profilul meu','profile'],['results','Recomandări','results'],['favorites','Favorite','results'],['compare','Compară','compare'],['calendar','Calendar','sources'],['plans','Planuri','profile'],['sources','Surse & metodă','sources']];$('#nav').innerHTML=nav.map(([id,label,i])=>`<button data-go="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''} title="${label}">${icon(i)}<span>${label}</span>${id==='compare'&&compared.length?`<span>${compared.length}</span>`:''}</button>`).join('')};

function scored(p){const pr=profile||Busola.emptyProfile();return {...p,matches:pr.interests.filter(i=>p.tags.includes(i)),admission:Busola.admission(p,pr),checks:Busola.checks(p,pr)}}
function cutoffComparison(p,value){
  const h=p.historicalCutoffs;
  if(!h||value===null||!Number.isFinite(value))return null;
  const rows=[['budget','Buget'],['fee','Taxă']].filter(([key])=>Number.isFinite(h[key])).map(([key,label])=>({key,label,value:h[key],delta:Math.round(value*100)-Math.round(h[key]*100)}));
  if(!rows.length)return null;
  const below=rows.filter(r=>r.delta<0);
  if(rows.length===1)return {rows,state:below.length?'below':'above',title:below.length?'Sub reperul istoric verificat':'La nivelul sau peste reperul istoric verificat'};
  return {rows,state:below.length===rows.length?'below':below.length?'mixed':'above',title:below.length===rows.length?'Sub ambele medii istorice':below.length?'Între cele două medii istorice':'La nivelul sau peste mediile istorice'};
}

function historicalMarkup(p,value){
  const h=p.historicalCutoffs;
  if(!h){const f=factFind(p,/ultima medie|ultimele medii|ultimul punctaj/i);return `<div class="history-unavailable"><strong>${p.country==='nl'?'Cum se face selecția':p.kind==='umf'?'Ultimul punctaj admis':'Ultima medie admisă'}</strong><p>${esc(f?.value||'Nu avem încă o medie istorică verificată pentru acest program.')}</p></div>`}
  const c=cutoffComparison(p,value);
  const rows=c?.rows||[['budget','Buget'],['fee','Taxă']].filter(([k])=>Number.isFinite(h[k])).map(([key,label])=>({key,label,value:h[key],delta:null}));
  return `<section class="history-block" aria-label="Repere istorice de admitere"><div class="history-heading"><strong>${h.scale?'Punctaj istoric verificat':'Ultimele medii verificate'}</strong><span>${esc(h.year)} · ${esc(h.session)}</span></div><div class="history-grid">${rows.map(r=>`<div class="history-value"><span>${r.label}</span><strong>${h.scale?r.value+' / '+h.scale:Busola.number(r.value)}</strong>${r.delta!==null?`<small class="${r.delta<0?'below':'above'}">${r.delta===0?'Egal cu reperul':r.delta<0?'Diferență: −'+Busola.number(-r.delta/100):'Diferență: +'+Busola.number(r.delta/100)}</small>`:''}</div>`).join('')}</div>${c?`<div class="admission-status ${c.state}"><strong>${c.state==='below'?'!':c.state==='mixed'?'↔':'↗'} ${c.title}</strong><p>${c.rows.map(r=>r.label+': '+(r.delta===0?'egală cu reperul':Busola.number(Math.abs(r.delta)/100)+(r.delta<0?' puncte sub reper':' puncte peste reper'))).join(' · ')}.</p></div>`:''}<p class="history-note">${h.note?esc(h.note)+' ':''}Repere din ${esc(h.year)}, nu praguri garantate pentru următoarea admitere. ${(h.source||[]).map(k=>`<a href="${esc(Busola.sources[k].url)}" target="_blank" rel="noopener noreferrer">Sursa ↗</a>`).join(' ')}</p></section>`;
}
card=function(p){

  const issue=p.checks.find(c=>c.state==='issue'),fee=factFind(p,/tax.*anual|școlarizare|tuition/i);

s="${p.id}">Fișa de admitere ↗</button><button class="compare-button ${compared.includes(p.id)?'selected':''}" data-compare="${p.id}" aria-pressed="${compared.includes(p.id)}">${compared.includes(p.id)?'✓ Selectat':'+ Compară'}</button></div></article>`;

showDetails=function(id){const p=programById(id);if(!p)return;const v=scored(p),extraRequirements=['external','poli','umf'].includes(p.kind)?[]:p.requirements||[];$('#dialog-content').innerHTML=`<button class="modal-close" data-action="close-modal" aria-label="Închide detaliile">×</button><div class="eyebrow">FIȘĂ DE ADMITERE</div><div class="detail-top"><div class="uni-icon ${p.color}">${esc(p.short)}</div><div><h2>${esc(p.name)}</h2><p>${esc(p.uni)} · ${esc(p.city)}<br>${esc(p.faculty||'')}</p></div></div><div class="detail-tabs"><a href="#detail-criteria">Cerințe</a><a href="#detail-documents">Documente</a><a href="#detail-facts">Taxe, termene & locuri</a></div>${profile?`<div class="notice"><strong>${v.matches.length}/${profile.interests.length} interese comune</strong><br>${v.matches.length?v.matches.map(interestLabel).join(' · '):'Programul nu se suprapune cu interesele selectate, dar îl poți explora.'}</div>`:''}<section id="detail-criteria" class="detail-section"><h3>${v.admission.value===null?esc(v.admission.label):(p.kind==='umf'?'Punctaj estimat: ':'Medie simulată: ')+resultText(v.admission)}</h3><p class="tiny muted" style="margin-top:8px">${esc(v.admission.formula)}</p>${historicalMarkup(p,v.admission.value)}<ul class="checklist">${v.checks.map(c=>`<li><span class="check-icon ${c.state}">${c.state==='ok'?'✓':c.state==='issue'?'!':'◷'}</span><span>${esc(c.text)}</span></li>`).join('')}${extraRequirements.map(c=>`<li><span class="check-icon">◷</span><span>${esc(c)}</span></li>`).join('')}</ul><p class="tiny muted">Situația este orientativă. Doar universitatea poate valida documentele și admiterea finală.</p></section><section id="detail-documents" class="detail-section"><h3>Documente și pregătire</h3><ul class="document-list">${p.documents.length?p.documents.map(d=>`<li>${esc(d)}</li>`).join(''):'<li>Lista completă nu este verificată în catalog; consultă sursa programului.</li>'}</ul><p class="tiny muted">Lista descrie ruta și anul indicate în surse; pot exista documente suplimentare pentru situații speciale.</p></section><section id="detail-facts" class="detail-section"><h3>Costuri, calendar și rezultate istorice</h3>${factsMarkup(p)}</section><div class="detail-source"><strong>Surse oficiale ale fișei</strong>${p.source.map(sourceLink).join('')}</div><div class="actions"><button class="btn" data-favorite="${p.id}">${favorites.includes(p.id)?'♥ Salvat la favorite':'♡ Salvează la favorite'}</button><button class="btn secondary" data-action="close-modal">Închide fișa</button></div>`;$('#dialog').dataset.program=id;if(!$('#dialog').open)$('#dialog').showModal()};
toggleCompare=function(id){if(!programById(id))return;if(compared.includes(id))compared=compared.filter(x=>x!==id);else if(compared.length<compareLimit())compared.push(id);else{if($('#dialog').open)$('#dialog').close();go('plans');toast(premium()?'Ai selectat maximum 5 programe. Elimină unul pentru a adăuga altul.':'Free permite 2 programe simultan. Premium demo permite 5.');return}persist();renderNav();if(page==='results'){$('#cards').innerHTML=cardsMarkup(allResults());$('#comparebar-container').innerHTML=comparebar()}else if(page==='catalog'){refreshCatalog();$('#comparebar-container').innerHTML=comparebar()}else if(page==='compare'||page==='favorites')render()};
comparison=function(){if(compared.length<2)return `<div class="page-head"><div><div class="eyebrow">DECIZII MAI CLARE</div><h2>Opțiunile, <span class="serif">una lângă alta.</span></h2></div></div><div class="empty"><h3>Selectează două programe din catalog.</h3><p>Poți compara ${compareLimit()} programe simultan cu planul ${premium()?'Premium demo':'Free'}.</p><button class="btn" data-go="catalog">Explorează catalogul →</button></div>`;const list=compared.map(programById).filter(Boolean).map(scored);const rows=[['Universitate',p=>`${esc(p.uni)}<p class="muted">${esc(p.faculty||'')} · ${esc(p.city)}</p>`],['Interese comune',p=>profile?p.matches.map(interestLabel).join(', ')||'Niciunul':'Completează profilul'],['Admitere',p=>p.admission.value!==null?`<strong>${esc(resultText(p.admission))}</strong><p>${p.admission.formula}</p>`:esc(p.admission.formula)],['Taxă de școlarizare',p=>`<p class="tuition-text">${esc(shortFact(p,/tax.*anual|școlarizare|tuition/i))}</p>`],['Trai / cazare',p=>esc(shortFact(p,/trai|cazare|cămin|living/i))],['Termene',p=>esc(shortFact(p,/termen|calendar|deadline/i))],['Locuri',p=>esc(shortFact(p,/locuri|capacitate|places/i))],['Repere istorice',p=>historicalMarkup(p,p.admission.value)],['Documente',p=>p.documents.map(esc).join('<br>')],['Fișa și sursele',p=>`<button class="btn secondary small" data-details="${p.id}">Deschide fișa ↗</button>`]];return `<div class="page-head"><div><div class="eyebrow">COMPARAȚIE · ${premium()?'PREMIUM DEMO':'FREE'}</div><h2>Alege cu <span class="serif">mai multă claritate.</span></h2><p>Verifică anul și categoria fiecărei valori. Datele istorice nu reprezintă praguri viitoare.</p></div><button class="btn secondary small" data-go="catalog">← Catalog</button></div><div class="table-wrap"><table style="min-width:${150+list.length*260}px"><thead><tr><th>Criteriu</th>${list.map(p=>`<th><h3>${esc(p.name)}</h3><p class="tiny muted">${esc(p.short)}</p><button class="quiet" data-remove="${p.id}">Elimină ×</button></th>`).join('')}</tr></thead><tbody>${rows.map(([l,fn])=>`<tr><td>${l}</td>${list.map(p=>`<td>${fn(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" data-action="report">Descarcă raportul ↓</button><button class="btn secondary" data-action="print">Tipărește / salvează PDF</button></div>`};
function accountPage(){const a=currentAccount();if(a)return `<div class="page-head"><div><div class="eyebrow">SPAȚIUL TĂU</div><h2>Bun venit, <span class="serif">${esc(a.name)}.</span></h2><p>Cont local · ${esc(a.email)}</p></div><button class="btn secondary small" data-v2="logout">Deconectare</button></div><div class="account-summary"><div class="panel"><span class="eyebrow">PLANUL TĂU</span><h3>${premium()?'✦ Premium demo':'Free'}</h3><p>${premium()?'Comparație cu 5 programe, favorite nelimitate și calendar exportabil.':'Comparație cu 2 programe și până la 3 favorite.'}</p><button class="btn" data-go="plans">Gestionează planul →</button></div><div class="panel"><span class="eyebrow">PROGRESUL TĂU</span><h3>${favorites.length} programe salvate</h3><p>Pași marcați ca pregătiți: ${Object.values(tasks).filter(Boolean).length}. ${profile?'Profilul de orientare este completat.':'Completează profilul pentru recomandări personalizate.'}</p><div class="actions"><button class="btn secondary" data-go="favorites">Favorite</button><button class="btn secondary" data-go="profile">Profilul meu</button></div></div></div><div class="notice info" style="margin-top:22px">Cont salvat pe acest dispozitiv. Autentificarea online și plățile nu sunt active.</div>`;return `<div class="page-head"><div><div class="eyebrow">PĂSTREAZĂ-ȚI DIRECȚIA</div><h2>Un cont pentru <span class="serif">următorul pas.</span></h2><p>Salvează programele care te atrag și construiește-ți planul de aplicare.</p></div></div><div class="form-layout"><form id="account-form" class="panel"><div class="auth-tabs"><button type="button" class="${authMode==='create'?'active':''}" data-auth="create">Creează cont demo</button><button type="button" class="${authMode==='login'?'active':''}" data-auth="login">Intră în cont demo</button></div><div class="field-grid">${authMode==='create'?'<div class="field full"><label for="account-name">Prenume fictiv</label><input id="account-name" name="account-name" maxlength="40" required placeholder="Alex"></div>':''}<div class="field full"><label for="account-email">E-mail demonstrativ</label><input id="account-email" name="account-email" type="email" maxlength="120" required placeholder="alex@example.com"><small>Nu trimitem mesaje. Folosește o adresă fictivă.</small></div></div><div id="account-error" class="error-msg" role="alert"></div><button class="btn" type="submit">${authMode==='create'?'Creează contul gratuit':'Intră în contul local'} →</button><p class="tiny muted" style="margin-top:18px">Demo local fără parolă. Oricine folosește acest browser poate accesa conturile demonstrative; nu introduce date sensibile.</p></form><aside class="form-aside"><div class="big-symbol">♡</div><h3>Opțiunile tale,<br>într-un singur loc.</h3><p>Favorite, profil și progres salvate local. Free pentru explorare, Premium pentru organizarea aplicării.</p><p>Poți continua să explorezi catalogul și fără cont.</p></aside></div>`}
function plansPage(){return `<div class="page-head"><div><div class="eyebrow">INVESTEȘTE ÎN CLARITATE</div><h2>Explorează gratuit.<br><span class="serif">Planifică în detaliu.</span></h2><p>Alege instrumentele de care ai nevoie pentru explorare și pregătirea aplicării.</p></div></div><div class="pricing-grid"><div class="price-card"><span class="eyebrow">PENTRU EXPLORARE</span><h3>Free</h3><div class="price">0 <small>lei</small></div><p>Descoperă direcțiile care ți se potrivesc.</p><ul><li>Toate fișele de admitere și sursele</li><li>Recomandări pe interese și profil</li><li>Compară 2 programe simultan</li><li>3 favorite într-un cont demo</li><li>Spațiu sponsorizat marcat explicit</li></ul><button class="btn secondary" data-v2="free">${premium()?'Revino la Free':'Folosește Free'}</button></div><div class="price-card featured"><span class="price-label">PLANIFICĂ APLICAREA</span><span class="eyebrow">PENTRU PLANUL DE APLICARE</span><h3>Busola Premium</h3><div class="price">29 <small>lei / lună · preț propus</small></div><p>Mai multe opțiuni, un plan mai ușor de urmărit.</p><ul><li>Tot ce este inclus în Free</li><li>Compară până la 5 programe</li><li>Favorite fără limita Free</li><li>Checklist de pregătire per program</li><li>Calendar cu termene viitoare verificate</li><li>Export calendar .ics</li><li>Fără spațiul sponsorizat demonstrativ</li></ul><button class="btn light" data-v2="premium">${premium()?'Premium demo este activ':'Activează Premium demo'} ↗</button><small>Fără card, plată sau reînnoire. Simulare locală.</small></div></div><div class="panel" style="margin-top:23px"><h3>Parteneriate universitare, cu transparență</h3><p>Universitățile ar putea plăti pentru prezentări de campus sau evenimente în spații etichetate „Sponsorizat”. Potrivirea și ordinea recomandărilor nu se schimbă în funcție de plată.</p><div class="notice">Bannerul de exemplu folosește o instituție fictivă.</div></div>`}
function favoritesPage(){if(!currentAccount())return `<div class="empty"><div class="symbol">♡</div><h3>Salvează opțiunile care te atrag.</h3><p>Creează un cont demonstrativ pentru favorite și pentru a testa planurile.</p><button class="btn" data-go="account">Creează cont demo →</button></div>`;return `<div class="page-head"><div><div class="eyebrow">LISTA TA SCURTĂ</div><h2>Opțiuni de <span class="serif">păstrat aproape.</span></h2><p>${favorites.length} favorite · ${premium()?'Premium demo':'Free: maximum 3'}</p></div><button class="btn secondary small" data-go="catalog">Adaugă din catalog ↗</button></div>${favorites.length?`<div class="cards">${favorites.map(programById).filter(Boolean).map(card).join('')}</div>`:'<div class="empty">Apasă ♡ pe un program din catalog ca să îl salvezi.</div>'}<div id="comparebar-container">${comparebar()}</div>`}
function gate(feature){return `<div class="empty"><div class="symbol">✦</div><h3>${feature}</h3><p>Disponibil cu Premium demo. Activează planul fără card pentru a demonstra funcția.</p><button class="btn" data-go="plans">Vezi planurile →</button></div>`}
function futureDeadlines(p){const items=Array.isArray(p.deadlines)?p.deadlines:p.deadline?[p.deadline]:[];return items.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&d.date>=today&&d.source?.length&&d.source.every(s=>Busola.sources[s])&&d.status!=='unknown'&&d.status!=='historical')}
function calendarPage(){if(!premium())return gate('Transformă favoritele într-un plan de aplicare.');const list=favorites.map(programById).filter(Boolean);return `<div class="page-head"><div><div class="eyebrow">PLANUL TĂU · PREMIUM</div><h2>Pas cu pas, <span class="serif">până la aplicare.</span></h2><p>Termene și pași de pregătire pentru programele tale favorite.</p></div><button class="btn secondary small" data-v2="ics">Exportă termenele .ics ↓</button></div><div class="notice info">Exportă termenele viitoare în calendarul tău. Notificările automate nu sunt active.</div>${list.length?list.map(p=>`<section class="panel calendar-card"><div class="section-top"><div><span class="eyebrow">${esc(p.uni)}</span><h3>${esc(p.name)}</h3></div><button class="quiet" data-details="${p.id}">Fișa oficială ↗</button></div><div class="deadline-list">${futureDeadlines(p).length?futureDeadlines(p).map(d=>`<div class="deadline"><strong>${esc(d.date.split('-').reverse().join('.'))}</strong><div>${esc(d.label)}<small>${(d.source||[]).map(sourceLink).join(' · ')}</small></div></div>`).join(''):'<p class="tiny muted">Nu avem încă un termen viitor verificat și structurat pentru acest program. Consultă fișa; datele 2026 sunt istorice.</p>'}</div><div class="task-list">${['Am citit cerințele și anul aplicării','Am verificat diploma și materiile necesare','Am pregătit documentele și traducerile cerute','Am verificat dovada de limbă / probele','Am confirmat bugetul și termenul în sursa oficială'].map((label,i)=>`<label><input type="checkbox" data-task="${p.id}:${i}" ${tasks[p.id+':'+i]?'checked':''}><span>${label}</span></label>`).join('')}</div></section>`).join(''):'<div class="empty" style="margin-top:22px"><h3>Adaugă întâi programe la favorite.</h3><p>Calendarul și checklistul se construiesc din opțiunile tale.</p><button class="btn" data-go="catalog">Explorează catalogul</button></div>'}`}
sourcesPage=function(){return `<div class="page-head"><div><div class="eyebrow">TRANSPARENȚĂ, DE LA ÎNCEPUT</div><h2>Surse reale.<br><span class="serif">Alegeri informate.</span></h2><p>${Busola.programs.length} opțiuni de studiu · ${uniCount()} universități. Urmărește informația până la sursa oficială.</p></div></div><div class="method-list"><div><b>Oficial / istoric</b><p>Valorile au sursa, anul, categoria și sesiunea. Ultimele medii sunt repere istorice, nu probabilități de admitere.</p></div><div><b>Estimări de cost</b><p>Cheltuielile de trai sunt estimări cu limite explicite. Nu sunt prețuri garantate și nu se transferă automat la 2027.</p></div><div><b>Recomandări independente</b><p>Țara și limba filtrează, interesele ordonează. Sponsorii nu modifică scorul sau clasamentul.</p></div></div><div class="panel" style="margin-top:22px"><h3>Biblioteca de surse</h3>${Object.entries(Busola.sources).map(([k,s],i)=>`<div class="source-card"><span class="source-number">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(s.label)}</h3><p>${esc(s.year||'An indicat în fișă')}</p>${sourceLink(k)}</div></div>`).join('')}</div><div class="footer-note"><button class="quiet" data-action="reset">Șterge profilul de orientare</button></div>`};
function downloadText(name,text,mime='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
downloadReport=function(){const list=page==='compare'?compared.map(programById).filter(Boolean):profile?allResults():Busola.programs;const lines=['BUSOLA · RAPORT DE EXPLORARE','Consultat: '+Busola.checked,'Fiecare câmp are propriul an. Admiterea nu este garantată.','',...list.flatMap(p=>[p.name+' — '+p.uni,p.faculty||'','Admitere: '+Busola.admission(p,profile||Busola.emptyProfile()).formula,...(profile&&Busola.admission(p,profile).value!==null?['Rezultat simulat: '+resultText(Busola.admission(p,profile))]:[]),...(cutoffComparison(p,Busola.admission(p,profile||Busola.emptyProfile()).value)?.rows||[]).map(r=>r.label+': '+(p.historicalCutoffs.scale?r.value+'/'+p.historicalCutoffs.scale+' puncte':Busola.number(r.value))+' (istoric '+p.historicalCutoffs.year+'); diferența simulării: '+(r.delta>0?'+':'')+Busola.number(r.delta/100)),...Busola.checks(p,profile||Busola.emptyProfile()).map(c=>'Cerință: '+c.text),...(['external','poli','umf'].includes(p.kind)?[]:p.requirements||[]),...(p.documents||[]).map(x=>'Document: '+x),...(p.facts||[]).map(f=>`${f.label}: ${f.value} [${f.year}; ${factStatus[f.status]||f.status}]`),...p.source.map(k=>Busola.sources[k].label+': '+Busola.sources[k].url),''])];downloadText('Busola-raport.txt','\ufeff'+lines.join('\r\n'));toast('Raportul complet a fost pregătit.');};
function foldCalendarLine(line){const encoder=new TextEncoder();let result='',size=0;for(const char of line){const bytes=encoder.encode(char).length;if(size+bytes>75){result+='\r\n ';size=1}result+=char;size+=bytes}return result}
function exportCalendar(){if(!premium()){go('plans');return}const events=favorites.map(programById).filter(Boolean).flatMap(p=>futureDeadlines(p).map(d=>({p,d})));if(!events.length){toast('Favoritele nu au termene viitoare verificate pentru export.');return}const safe=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Busola//MVP V2//RO','CALSCALE:GREGORIAN'];events.forEach(({p,d},i)=>{const dt=d.date.replaceAll('-','');lines.push('BEGIN:VEVENT',`UID:${p.id}-${dt}-${i}@busola.demo`,'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z'),`DTSTART;VALUE=DATE:${dt}`,`SUMMARY:${safe(p.name+' — '+d.label)}`,`DESCRIPTION:${safe('Verifică ora exactă în sursă. '+d.source.map(k=>Busola.sources[k].url).join(' '))}`,'END:VEVENT')});lines.push('END:VCALENDAR');downloadText('Busola-termene.ics',lines.map(foldCalendarLine).join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast(`Termene pregătite pentru export: ${events.length}.`)}
document.addEventListener('submit',e=>{if(e.target.id!=='account-form')return;e.preventDefault();const email=$('#account-email').value.trim().toLowerCase();if(!email||email.length>120)return;const existing=accounts.find(a=>a.email===email);if(authMode==='login'){if(!existing){$('#account-error').textContent='Nu există acest cont pe dispozitiv. Creează întâi un cont demo.';return}sessionId=existing.id;loadAccount();saveAccounts();go('account');toast('Ai intrat în contul demonstrativ.');return}if(existing){$('#account-error').textContent='Acest cont demo există deja. Alege „Intră în cont demo”.';return}const name=$('#account-name').value.trim();if(!name){$('#account-error').textContent='Completează prenumele fictiv.';return}sessionId='demo-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);accounts.push({id:sessionId,email,name:name.slice(0,40),plan:'free',profile:profile?{...clone(profile),name:name.slice(0,40)}:null,compared:[...compared],favorites:[],tasks:{}});favorites=[];tasks={};loadAccount();saveAccounts();go('account');toast('Contul tău a fost creat.');});
document.addEventListener('input',e=>{if(e.target.id==='catalog-search'){catalogQuery=e.target.value;refreshCatalog()}});
document.addEventListener('change',e=>{if(e.target.id==='catalog-country'){catalogCountry=e.target.value;refreshCatalog()}if(e.target.id==='catalog-uni'){catalogUniversity=e.target.value;refreshCatalog()}if(e.target.id==='catalog-future'){catalogFuture=e.target.checked;refreshCatalog()}if(e.target.dataset.task&&premium()){tasks[e.target.dataset.task]=e.target.checked;persist()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.auth){authMode=b.dataset.auth;render();return}if(b.dataset.favorite){const id=b.dataset.favorite;if(!programById(id))return;if(!currentAccount()){if($('#dialog').open)$('#dialog').close();go('account');toast('Creează un cont demo pentru a salva favorite.');return}if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else if(!premium()&&favorites.length>=3){if($('#dialog').open)$('#dialog').close();go('plans');toast('Ai atins limita Free de 3 favorite. Premium demo elimină limita.');return}else favorites.push(id);persist();if($('#dialog').open)showDetails(id);else render();return}if(b.dataset.v2==='premium'){if(!currentAccount()){go('account');toast('Creează întâi un cont demo, apoi activează Premium.');return}currentAccount().plan='premium';persist();render();toast('Premium demo activat. Nu s-a efectuat nicio plată.')}if(b.dataset.v2==='free'){if(currentAccount()){currentAccount().plan='free';compared=compared.slice(0,2);persist();render();toast('Planul Free este activ. Favoritele existente sunt păstrate.')}else go('catalog')}if(b.dataset.v2==='logout'){persist();sessionId='';profile=null;draft=Busola.emptyProfile();compared=[];favorites=[];tasks={};saveAccounts();try{localStorage.removeItem(STORAGE)}catch{}go('home');toast('Te-ai deconectat din contul demo.')}if(b.dataset.v2==='ics')exportCalendar();if(b.dataset.action==='confirm-reset')persist();if(b.dataset.action==='sponsor-info'){go('plans')}});
render();
</script></body></html>
